[preset.0]

name="Windows Desktop"
platform="Windows Desktop"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
; Release exports strip development-only scenes/data/tooling.
exclude_filter="scenes/buddy_lab.tscn, scenes/dual_profile_lab.tscn, scenes/test_runner.tscn, scenes/spike_transparent_window.tscn, scenes/spike_miitopia_look.tscn, data/buddy/lab_envelope_bounds.tres, tests/*, docs/*, devtools/*, authoring/*, *.md"
export_path="build/windows/DesktopBuddy.exe"
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

binary_format/architecture="x86_64"
binary_format/embed_pck=false
debug/export_console_wrapper=1
application/modify_resources=true

[preset.1]

name="Windows Steam Demo Protected"
platform="Windows Desktop"
runnable=false
advanced_options=true
dedicated_server=false
custom_features="steam_demo,protected_build"
export_filter="all_resources"
include_filter=""
; Keep the owner-approved demo runtime intact, but never ship developer/source-adjacent material.
exclude_filter="scenes/buddy_lab.tscn, scenes/dual_profile_lab.tscn, scenes/test_runner.tscn, scenes/spike_transparent_window.tscn, scenes/spike_miitopia_look.tscn, data/buddy/lab_envelope_bounds.tres, tests/*, docs/*, devtools/*, authoring/*, tools/*, artifacts/*, Mcp/*, .github/*, .codex/*, .mcp/*, *.md, *.sln, *.csproj, *.props, *.targets, *.ps1, *.bat"
export_path="build/steam-demo-protected/DesktopBuddyDemo.exe"
patches=PackedStringArray()
; A non-empty wildcard is mandatory: encrypt_pck alone only protects the pack directory.
encryption_include_filters="*"
encryption_exclude_filters=""
seed=0
encrypt_pck=true
encrypt_directory=true
script_export_mode=2

[preset.1.options]

custom_template/debug=""
custom_template/release=".protected/templates/windows_release_x86_64.exe"
binary_format/architecture="x86_64"
binary_format/embed_pck=true
debug/export_console_wrapper=0
application/modify_resources=true
dotnet/include_scripts_content=false
dotnet/include_debug_symbols=false
dotnet/embed_build_outputs=false
