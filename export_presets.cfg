[preset.2]

; Experimental Godot C# Web export. This preset is consumed only by the pinned #118976 fork in CI;
; stock Godot 4.6.1 cannot export this C# project to Web.
name="Web itch.io experimental"
platform="Web"
runnable=false
advanced_options=true
dedicated_server=false
custom_features="itch_io,protected_build,web_experimental"
export_filter="all_resources"
include_filter=""
exclude_filter="scenes/buddy_lab.tscn, scenes/dual_profile_lab.tscn, scenes/test_runner.tscn, scenes/spike_transparent_window.tscn, scenes/spike_miitopia_look.tscn, data/buddy/lab_envelope_bounds.tres, tests/*, docs/*, devtools/*, authoring/*, tools/*, artifacts/*, Mcp/*, .github/*, .codex/*, .mcp/*, *.md, *.sln, *.csproj, *.props, *.targets, *.ps1, *.bat"
export_path="build/itch-web/index.html"
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.2.options]

custom_template/debug=""
custom_template/release=".web-build/godot.web.template_release.wasm32.nothreads.mono.zip"
variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=false
html/export_icon=true
html/custom_html_shell=""
; .NET Web assets are SRI-checked. A stale browser cache can otherwise answer a revalidation with
; 304 and make the runtime validate old WASM bytes against the new dotnet.boot.js hashes.
html/head_include="<script>(()=>{const nativeFetch=globalThis.fetch.bind(globalThis);globalThis.fetch=(input,init)=>{const url=typeof input==='string'?input:(typeof Request!=='undefined'&&input instanceof Request?input.url:String(input));if(url.includes('_framework/')){return nativeFetch(input,{...(init||{}),cache:'reload'});}return nativeFetch(input,init);};})();</script>"
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=false
progressive_web_app/enabled=false
dotnet/skip_dotnet_export=true
