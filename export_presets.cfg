[preset.0]

name="Windows Desktop"
platform="Windows Desktop"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
; Release exports strip development-only scenes and data (ARCHITECTURE.md Section 22):
; the physics laboratory, the test-runner host, headless journeys, and dev docs.
; Automation/telemetry C# is additionally guarded behind BuildInfo.IsDebugBuild,
; so no automation code path exists in a release template.
exclude_filter="scenes/buddy_lab.tscn, scenes/dual_profile_lab.tscn, scenes/test_runner.tscn, scenes/spike_transparent_window.tscn, data/buddy/lab_envelope_bounds.tres, tests/*, docs/*, *.md"
export_path="build/windows/DesktopBuddy.exe"
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

; Milestone 0 scaffolding only. Per-pixel transparency, codesign, icons, and
; version metadata are finalized during the Milestone 2 Windows shell work.
binary_format/architecture="x86_64"
binary_format/embed_pck=false
debug/export_console_wrapper=1
application/modify_resources=true
