[preset.2]

name="Windows itch.io"
platform="Windows Desktop"
runnable=false
advanced_options=false
dedicated_server=false
custom_features="itch_io"
export_filter="all_resources"
include_filter=""
; The itch build uses the same release stripping as the Demo. Its smaller gameplay surface is
; enforced by DemoScope at composition time so Paint Buddy and Work Mode remain available while
; Paint Room and Buddy Studio never compose or register commands.
exclude_filter="scenes/buddy_lab.tscn, scenes/dual_profile_lab.tscn, scenes/test_runner.tscn, scenes/spike_transparent_window.tscn, scenes/spike_miitopia_look.tscn, data/buddy/lab_envelope_bounds.tres, tests/*, docs/*, devtools/*, authoring/*, *.md"
export_path="build/itch/DesktopBuddy.exe"
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.2.options]

binary_format/architecture="x86_64"
binary_format/embed_pck=false
debug/export_console_wrapper=0
application/modify_resources=true
