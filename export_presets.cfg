[preset.2]

name="Windows itch.io"
platform="Windows Desktop"
runnable=false
advanced_options=true
dedicated_server=false
custom_features="itch_io,protected_build"
export_filter="all_resources"
include_filter=""
; Public itch builds use the reduced DemoScope feature surface and the safe layers of the former
; Steam-demo hardening pass. Do not ship source-adjacent/dev material in the public package.
exclude_filter="scenes/buddy_lab.tscn, scenes/dual_profile_lab.tscn, scenes/test_runner.tscn, scenes/spike_transparent_window.tscn, scenes/spike_miitopia_look.tscn, data/buddy/lab_envelope_bounds.tres, tests/*, docs/*, devtools/*, authoring/*, tools/*, artifacts/*, Mcp/*, .github/*, .codex/*, .mcp/*, *.md, *.sln, *.csproj, *.props, *.targets, *.ps1, *.bat"
export_path="build/itch/DesktopBuddy.exe"
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.2.options]

binary_format/architecture="x86_64"
; Embed the pack to remove the obvious loose-PCK extraction path. The stronger AES PCK layer from
; agent/steam-demo-hardening requires a keyed custom native template and remains Windows-specific.
binary_format/embed_pck=true
debug/export_console_wrapper=0
application/modify_resources=true
dotnet/include_scripts_content=false
dotnet/include_debug_symbols=false
dotnet/embed_build_outputs=false

[preset.3]

; Experimental Godot C# Web export. This preset is consumed only by the pinned #118976 fork in CI;
; stock Godot 4.6.1 cannot export this C# project to Web.
name="Web itch.io experimental"
platform="Web"
runnable=false
advanced_options=true
dedicated_server=false
custom_features="itch_io,protected_build,web_experimental"
export_filter="all_resources"
include_filter=""
exclude_filter="scenes/buddy_lab.tscn, scenes/dual_profile_lab.tscn, scenes/test_runner.tscn, scenes/spike_transparent_window.tscn, scenes/spike_miitopia_look.tscn, data/buddy/lab_envelope_bounds.tres, tests/*, docs/*, devtools/*, authoring/*, tools/*, artifacts/*, Mcp/*, .github/*, .codex/*, .mcp/*, *.md, *.sln, *.csproj, *.props, *.targets, *.ps1, *.bat"
export_path="build/itch-web/index.html"
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.3.options]

custom_template/debug=""
custom_template/release=".web-build/godot.web.template_release.wasm32.nothreads.mono.zip"
variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=false
vram_texture_compression/for_mobile=true
html/export_icon=true
html/custom_html_shell=""
html/head_include=""
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=false
progressive_web_app/enabled=false
