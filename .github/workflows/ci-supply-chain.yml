name: CI Supply Chain

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/**
      - devtools/verification/verify_ci_supply_chain.py
      - devtools/verification/test_verify_ci_supply_chain.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-supply-chain-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Verify workflow supply-chain policy
        run: python3 devtools/verification/verify_ci_supply_chain.py .github/workflows

      - name: Policy verifier regression tests
        run: python3 -m unittest devtools.verification.test_verify_ci_supply_chain
