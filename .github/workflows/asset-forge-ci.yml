name: Asset Forge CI

on:
  workflow_dispatch:
  push:
    branches:
      - asset-forge
  pull_request:
    branches:
      - asset-forge
      - main

env:
  GODOT_VERSION: 4.6.1-stable
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Build game solution
        run: dotnet build DesktopBuddy.sln -c Debug

      - name: Domain unit tests
        run: dotnet test tests/DesktopBuddy.Domain.Tests/DesktopBuddy.Domain.Tests.csproj -c Debug --no-build --filter "FullyQualifiedName!~ProgressStoreTests"

      - name: Asset Forge deterministic Core tests
        run: dotnet test devtools/AssetForge.Core.Tests/DesktopBuddy.AssetForge.Core.Tests.csproj -c Debug

      - name: Build standalone Asset Forge
        run: dotnet build devtools/AssetForge/DesktopBuddy.AssetForge.csproj -c Debug

      - name: Verify developer-only source exclusions
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'devtools/**/*' DesktopBuddy.csproj
          grep -F 'authoring/**/*' DesktopBuddy.csproj
          grep -F 'shared/**/*' DesktopBuddy.csproj
          grep -F 'devtools/*' export_presets.cfg
          grep -F 'authoring/*' export_presets.cfg

      - name: Generate Asset Forge CI fixtures
        run: dotnet run --project devtools/AssetForge.Cli/DesktopBuddy.AssetForge.Cli.csproj -c Debug -- --ci-fixture "$PWD"

      - name: Generate Environment v1 CI fixtures
        run: dotnet run --project devtools/AssetForge.V1Fixtures/DesktopBuddy.AssetForge.V1Fixtures.csproj -c Debug -- "$PWD"

      - name: Verify generated fixtures
        run: dotnet run --project devtools/AssetForge.Cli/DesktopBuddy.AssetForge.Cli.csproj -c Debug -- --verify-all "$PWD"

      - name: Download pinned Godot
        run: |
          set -euo pipefail
          NAME="Godot_v${GODOT_VERSION}_mono_linux_x86_64"
          URL="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}/${NAME}.zip"
          curl -fL --retry 3 -o godot.zip "$URL"
          unzip -q godot.zip
          GODOT_BIN="$(find "$PWD/$NAME" -maxdepth 2 -type f -name 'Godot*' | head -n 1)"
          test -n "$GODOT_BIN"
          chmod +x "$GODOT_BIN"
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"

      - name: Import game
        run: xvfb-run -a "$GODOT_BIN" --headless --path . --import

      - name: Boot smoke
        run: xvfb-run -a "$GODOT_BIN" --headless --path . -- --scenario=boot_smoke --seed=1

      - name: Capture - pistol lifecycle
        run: xvfb-run -a "$GODOT_BIN" --headless --path . -- --scenario=pistol_fire --seed=1

      - name: Capture - pistol punctuation
        run: xvfb-run -a "$GODOT_BIN" --headless --path . -- --scenario=pistol_punctuation --seed=1

      - name: Capture - baseball bat fling
        run: xvfb-run -a "$GODOT_BIN" --headless --path . -- --scenario=capture_homerun_bat_fling --seed=1

      - name: Capture - boxing glove critical head
        run: xvfb-run -a "$GODOT_BIN" --headless --path . -- --scenario=glove_critical_head_impact --seed=1

      - name: Capture - grenade lifecycle
        run: xvfb-run -a "$GODOT_BIN" --headless --path . -- --scenario=grenade_fuse --seed=1

      - name: Capture - Paint Buddy limb and neck mapping
        run: xvfb-run -a "$GODOT_BIN" --headless --path . -- --scenario=paint_limb_pose_mapping --seed=1

      - name: Capture - Buddy Studio composition
        run: xvfb-run -a "$GODOT_BIN" --headless --path . -- --scenario=buddy_studio_ui_composition --seed=1

      - name: Capture - Work Mode resilience
        run: xvfb-run -a "$GODOT_BIN" --headless --path . -- --scenario=work_mode_resilience --seed=1

      - name: Generated glasses catalogue and persistence
        run: xvfb-run -a "$GODOT_BIN" --headless --path . -- --scenario=asset_forge_generated_glasses --seed=1

      - name: Generated torso and foot replacements
        run: xvfb-run -a "$GODOT_BIN" --headless --path . -- --scenario=asset_forge_generated_replacements --seed=1

      - name: Generated replacement paint UV separation
        run: xvfb-run -a "$GODOT_BIN" --headless --path . -- --scenario=asset_forge_generated_paint_uvs --seed=1

      - name: Buddy Studio owned-preview persistence
        run: xvfb-run -a "$GODOT_BIN" --headless --path . -- --scenario=buddy_studio_ownership_preview --seed=1

      - name: Generated replacement connector fitting
        run: xvfb-run -a "$GODOT_BIN" --headless --path . -- --scenario=asset_forge_replacement_connector_fit --seed=1

      - name: Generated Lamp runtime
        run: xvfb-run -a "$GODOT_BIN" --headless --path . -- --scenario=asset_forge_generated_lamp --seed=1

      - name: Generated Sofa runtime
        run: xvfb-run -a "$GODOT_BIN" --headless --path . -- --scenario=asset_forge_generated_sofa --seed=1

      - name: Generated Environment v1 runtime
        run: xvfb-run -a "$GODOT_BIN" --headless --path . -- --scenario=asset_forge_generated_environment_v1 --seed=1

      - name: Import standalone Asset Forge project
        run: |
          mkdir -p devtools/AssetForge/.generated/profiles
          cp data/buddy/lab_buddy_look.tres devtools/AssetForge/.generated/profiles/
          cp data/buddy/lab_buddy_visual.tres devtools/AssetForge/.generated/profiles/
          cp data/buddy/lab_puppet_rig.tres devtools/AssetForge/.generated/profiles/
          xvfb-run -a "$GODOT_BIN" --headless --path devtools/AssetForge --import

      - name: Boot standalone Asset Forge workspace
        run: xvfb-run -a "$GODOT_BIN" --headless --path devtools/AssetForge --quit-after 5
