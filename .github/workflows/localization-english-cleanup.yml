name: Localization English Cleanup

on:
  push:
    branches: [feature/localization-ru]
    paths:
      - .github/workflows/localization-english-cleanup.yml

permissions:
  contents: write

jobs:
  apply-copy-cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/localization-ru

      - name: Apply English source cleanup
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_all(path, replacements):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              for old, new in replacements:
                  if old not in text:
                      raise SystemExit(f"Expected text not found in {path}: {old!r}")
                  text = text.replace(old, new)
              p.write_text(text, encoding='utf-8', newline='')

          replace_all('src/Onboarding/FirstSessionGuidanceController.cs', [
              (
                  'Shows your current money count. Earn them by playing with your Buddy or using Work Mode. You can spend them on tools and customisation. Rough play pays the most.',
                  'Shows your current credit balance. Earn Credits by playing with your Buddy or using Work Mode. Spend them on tools and customisation. Rough play pays the most.'
              ),
              (
                  'Choose the part of Buddy you want to customise, such as his eyes, glasses, headwear, top or shoes.',
                  'Choose the part of Buddy you want to customise, such as its eyes, glasses, headwear, top or shoes.'
              ),
              (
                  'Shows how much work you have done. The number increments per action, keyboard press or mouse click. Click on the screen to switch between this session count and your lifetime total count.',
                  "Shows how busy you've been in Work Mode. The number goes up with actions, keyboard presses and mouse clicks. Click the screen to switch between this session count and your lifetime total."
              ),
              (
                  '"Hi! Let me introduce you to your buddy. Click and hold your left mouse button on " +\n            "your Buddy to grab him."',
                  '"Hi! Let me introduce you to your Buddy. Click and hold the left mouse button on " +\n            "your Buddy to grab it."'
              ),
              (
                  '"Nice stuff! You can hold the right mouse button to charge your bat up for a big " +\n            "swing. Some other tools have some extra interaction by clicking or holding the " +\n            "right mouse button. Try them out yourself later, but for now try hitting the buddy " +\n            "with a charged swing."',
                  '"Nice stuff! Hold the right mouse button to charge your bat up for a big swing. " +\n            "Some other tools have extra interactions when you click or hold the right mouse " +\n            "button too. Try them out later, but for now hit Buddy with a charged swing."'
              ),
              (
                  '"To unequip a tool you can switch in the Inventory or press the \'D\' button to drop " +\n            "it. You can re-equip dropped tools by double-clicking it. Try to drop it now."',
                  '"You can switch tools in the Inventory, or press \'D\' to drop the one you have " +\n            "equipped. Double-click a dropped tool to equip it again. Try dropping the bat now."'
              ),
              (
                  '"There are many tools to choose from. Let\'s start with my favourite which is the " +\n            "Brush tool to start painting."',
                  '"There are plenty of tools to choose from. Let\'s start with my favourite: the Brush."'
              ),
              (
                  '"Here you can choose any colour you like. The big button to the right opens up the " +\n            "advanced color pallette. Let\'s just choose one of these for now."',
                  '"Here you can choose any colour you like. The big button on the right opens the " +\n            "advanced colour picker. Let\'s just choose one of these for now."'
              ),
              (
                  '"Paint away! When you are happy, click on the \'Save\' button below."',
                  '"Paint away! When you\'re happy with it, click Save below."'
              ),
              (
                  '"Click on the \'Use Character\' to start playing with your new Buddy!"',
                  '"Click Use Character to start playing with your new Buddy!"'
              ),
              (
                  '"Let\'s go with something new but nostalgic, the Spray tool!"',
                  '"Let\'s try something new but nostalgic: the Spray tool!"'
              ),
              (
                  '"We need to admire your drawing more. Drag any panel by its title bar and move it " +\n            "outside of the game window. You can also click the red pin button."',
                  '"Let\'s get a better look at your drawing. Drag any panel by its title bar and move " +\n            "it outside the game window. You can also click the red pin button."'
              ),
              (
                  '"Now let\'s bring your buddy more up to style. Open Buddy Studio so we can customise " +\n            "your Buddy with lots of apparel."',
                  '"Now let\'s get your Buddy properly dressed up. Open Buddy Studio so we can " +\n            "customise it with some new apparel."'
              ),
              (
                  '"Let\'s see, your buddy could use a new nose. Click on the Nose category to see what " +\n            "we\'ve got."',
                  '"Let\'s see... your Buddy could use a new nose. Click the Nose category to see what " +\n            "we\'ve got."'
              ),
              (
                  '"It looks great! Let\'s click on the \'Buy\' button. Alternatively, you can double-click " +\n            "on an item to buy it."',
                  '"It looks great! Click Buy. You can also double-click an item to buy it."'
              ),
              (
                  '"Now that is what I call a nose. Now your buddy is looking mighty fine!"',
                  '"Now that is what I call a nose. Your Buddy is looking mighty fine!"'
              ),
              (
                  '"Last but not least: Work Mode. Enter work mode for when you need to concentrate and " +\n            "want to let your buddy sit beside you."',
                  '"Last but not least: Work Mode. Use it when you need to concentrate and want your " +\n            "Buddy sitting beside you."'
              ),
              (
                  '"Click and hold on the Buddy with the left mouse button to drag your companion " +\n            "wherever you want it."',
                  '"Click and hold Buddy with the left mouse button, then drag the companion wherever " +\n            "you want it."'
              ),
              (
                  '"Your Buddy will earn money while you work. Click on the screen to switch between " +\n            "this session\'s total count and your lifetime total count."',
                  '"Your Buddy will earn Credits while you work. Click the screen to switch between " +\n            "this session\'s activity count and your lifetime total."'
              ),
              (
                  '"Ready to head back to play mode? Double-click on your Buddy or click on the \'X\' " +\n            "button to return."',
                  '"Ready to head back to Play Mode? Double-click your Buddy or click the \'X\' button " +\n            "to return."'
              ),
              (
                  '"Well that was it, I hope you\'ll become the best of buds! If you ever need help, " +\n            "click on the \'?\' in the title bar and hover over anything on screen for context, " +\n            "or restart the tutorial from the settings screen. Have fun with your Buddy!"',
                  '"Well, that\'s it. I hope you\'ll become the best of buds! If you ever need help, " +\n            "click \'?\' in the title bar and hover over anything on screen for context, or restart " +\n            "the tutorial from Settings. Have fun with your Buddy!"'
              ),
          ])

          replace_all('src/CharacterEditor/CharacterEditorHost.SettingsRows.cs', [
              (
                  'Controls gameplay sounds, think of hits, gunfire and explosions.',
                  'Controls gameplay sounds such as hits, gunfire and explosions.'
              ),
              (
                  'Sets the maximum frame rate of your game.',
                  "Sets the game's maximum frame rate."
              ),
              (
                  "Gives Work Mode's buddy and computer a chunky CRT look: coarser pixels, fewer colours and scanlines.",
                  'Gives Buddy and the computer in Work Mode a chunky CRT look: coarser pixels, fewer colours and scanlines.'
              ),
          ])
          PY

      - name: Commit cleanup
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No cleanup changes were needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/Onboarding/FirstSessionGuidanceController.cs src/CharacterEditor/CharacterEditorHost.SettingsRows.cs
          git commit -m "Clean canonical English player copy"
          git push origin HEAD:feature/localization-ru
