name: CI

# Milestone 0 CI gate (ROADMAP.md, ARCHITECTURE.md Section 22):
# dotnet build, domain unit tests, headless editor import, and the boot smoke
# scenario/journey on every push and PR. The build must be green from a clean
# clone with no locally installed Steam SDK; no proprietary Steam binaries are
# required or referenced here. The standalone Windows matrix (TEST_PLAN.md
# Section 5) and the MCP interactive tier are manual and never run in CI.

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  # Pinned engine version. Must match README.md and the editor/export templates.
  GODOT_VERSION: 4.6.1-stable
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET (pinned by global.json)
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Build solution
        run: dotnet build DesktopBuddy.sln -c Debug

      - name: Domain unit tests
        run: dotnet test tests/DesktopBuddy.Domain.Tests/DesktopBuddy.Domain.Tests.csproj -c Debug --no-build

      - name: Fail if any Steam SDK binary is present
        run: |
          if git ls-files | grep -iE 'steam_api(64)?\.(dll|so|dylib)|steam_appid\.txt'; then
            echo "Proprietary/dev Steam files must not be committed."; exit 1;
          fi

      - name: Download pinned Godot (.NET/mono, Linux)
        run: |
          set -euo pipefail
          NAME="Godot_v${GODOT_VERSION}_mono_linux_x86_64"
          URL="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}/${NAME}.zip"
          curl -fL --retry 3 -o godot.zip "$URL"
          unzip -q godot.zip
          echo "GODOT_BIN=$PWD/${NAME}/${NAME}" >> "$GITHUB_ENV"

      - name: Headless editor import
        run: xvfb-run -a "$GODOT_BIN" --headless --path . --import

      - name: Boot smoke scenario
        run: xvfb-run -a "$GODOT_BIN" --headless --path . -- --scenario=boot_smoke --seed=1

      - name: Boot smoke journey
        run: xvfb-run -a "$GODOT_BIN" --headless --path . -- --journey=boot_smoke --seed=1

      - name: Passive rig scenario
        run: xvfb-run -a "$GODOT_BIN" --headless --path . -- --scenario=passive_rig --seed=1

      - name: Standing and recovery scenario
        run: xvfb-run -a "$GODOT_BIN" --headless --path . -- --scenario=standing_recovery --seed=1

      - name: Seeded autonomous motion scenario
        run: xvfb-run -a "$GODOT_BIN" --headless --path . -- --scenario=autonomous_motion --seed=1

      - name: Laboratory controls scenario
        run: xvfb-run -a "$GODOT_BIN" --headless --path . -- --scenario=laboratory_controls --seed=1

      - name: Grab tether release scenario
        run: xvfb-run -a "$GODOT_BIN" --headless --path . -- --scenario=grab_release --seed=1

      - name: Grab fear resistance scenario
        run: xvfb-run -a "$GODOT_BIN" --headless --path . -- --scenario=grab_resistance --seed=1

      - name: Grab hard-recovery cleanup scenario
        run: xvfb-run -a "$GODOT_BIN" --headless --path . -- --scenario=grab_hard_recovery --seed=1

      - name: Room resize and zoom scenario
        run: xvfb-run -a "$GODOT_BIN" --headless --path . -- --scenario=room_resize_zoom --seed=1

      - name: Lab spawn and settle journey
        run: xvfb-run -a "$GODOT_BIN" --headless --path . -- --journey=lab_spawn_settle --seed=1

      - name: Telemetry export consumer
        run: xvfb-run -a "$GODOT_BIN" --headless --path . -- --scenario=passive_rig --seed=1 --artifacts=.artifacts/passive_rig

      - name: Repeated-run envelope
        run: xvfb-run -a "$GODOT_BIN" --headless --path . -- --scenario=repeat_envelope --seed=1

      - name: Idle soak (three-minute variant)
        run: xvfb-run -a "$GODOT_BIN" --headless --fixed-fps 120 --path . -- --scenario=idle_soak_ci --seed=1 --artifacts=.artifacts/idle_soak_ci

      - name: Dual-profile stability smoke
        run: xvfb-run -a "$GODOT_BIN" --headless --path . -- --scenario=dual_profile_smoke --seed=1

      - name: Grab-throw journey
        run: xvfb-run -a "$GODOT_BIN" --headless --path . -- --journey=lab_grab_throw --seed=1

      - name: Walk-jump journey
        run: xvfb-run -a "$GODOT_BIN" --headless --path . -- --journey=lab_walk_jump --seed=1

  full-soak:
    # Push CI runs the three-minute variant; workflow_dispatch runs both complete
    # 216,000-tick entry points with fixed-fps fast-forward.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet build DesktopBuddy.sln -c Debug
      - name: Download pinned Godot
        run: |
          NAME="Godot_v${GODOT_VERSION}_mono_linux_x86_64"
          curl -fL -o godot.zip "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}/${NAME}.zip"
          unzip -q godot.zip
          echo "GODOT_BIN=$PWD/${NAME}/${NAME}" >> "$GITHUB_ENV"
      - name: Full 30-minute idle soak scenario
        run: xvfb-run -a "$GODOT_BIN" --headless --fixed-fps 120 --path . -- --scenario=idle_soak --seed=1 --artifacts=.artifacts/idle_soak
      - name: Full 30-minute idle soak journey
        run: xvfb-run -a "$GODOT_BIN" --headless --fixed-fps 120 --path . -- --journey=lab_idle_soak --seed=1 --artifacts=.artifacts/lab_idle_soak
