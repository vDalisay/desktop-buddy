name: CI

# Runs on the self-hosted runner (see docs); GitHub-hosted minutes are exhausted.
on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

# One runner, so a burst of pushes must not queue a full run each.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned engine version. Must match README.md and the editor/export templates.
  GODOT_VERSION: 4.6.1-stable
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  # Every push, any branch: does it still compile and do the unit tests pass?
  # Kept deliberately short so agent branches get feedback in a minute or two.
  quick:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET (pinned by global.json)
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Build solution
        run: dotnet build DesktopBuddy.sln -c Debug

      - name: Domain unit tests
        run: dotnet test tests/DesktopBuddy.Domain.Tests/DesktopBuddy.Domain.Tests.csproj -c Debug --no-build

      - name: Fail if any Steam SDK binary is present
        run: |
          if git ls-files | grep -iE 'steam_api(64)?\.(dll|so|dylib)|steam_appid\.txt'; then
            echo "Proprietary/dev Steam files must not be committed."; exit 1;
          fi

      - name: Verify authored SFX import sidecars
        run: bash devtools/verify_sfx_imports.sh

  # Pull requests and manual dispatch: the full Godot scenario and journey sweep.
  build-test:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET (pinned by global.json)
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Build solution
        run: dotnet build DesktopBuddy.sln -c Debug

      - name: Domain unit tests
        run: dotnet test tests/DesktopBuddy.Domain.Tests/DesktopBuddy.Domain.Tests.csproj -c Debug --no-build

      - name: Fail if any Steam SDK binary is present
        run: |
          if git ls-files | grep -iE 'steam_api(64)?\.(dll|so|dylib)|steam_appid\.txt'; then
            echo "Proprietary/dev Steam files must not be committed."; exit 1;
          fi

      - name: Verify authored SFX import sidecars
        run: bash devtools/verify_sfx_imports.sh

      - name: Download pinned Godot (.NET/mono, Linux)
        run: |
          set -euo pipefail
          NAME="Godot_v${GODOT_VERSION}_mono_linux_x86_64"
          URL="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}/${NAME}.zip"
          curl -fL --retry 3 -o godot.zip "$URL"
          unzip -q godot.zip
          GODOT_BIN="$(find "$PWD/$NAME" -maxdepth 2 -type f -name 'Godot*' | head -n 1)"
          test -n "$GODOT_BIN"
          chmod +x "$GODOT_BIN"
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"

      - name: Headless editor import
        run: xvfb-run -a "$GODOT_BIN" --headless --path . --import

      - name: Inventory purchase scenario
        run: xvfb-run -a "$GODOT_BIN" --headless --path . -- --scenario=shop_panel_purchase --seed=1

      - name: Settings hotkey capture scenario
        run: xvfb-run -a "$GODOT_BIN" --headless --path . -- --scenario=settings_hotkey_capture --seed=1

      - name: Win98 catalogue update scenario
        run: xvfb-run -a "$GODOT_BIN" --headless --path . -- --scenario=win98_catalog_grid_update --seed=1

      # DEMO-9 closure sweep: these are the implementation-plan acceptance paths that were
      # previously covered only by local/manual testing or narrower milestone jobs.
      - name: Demo shop progression journey
        run: xvfb-run -a "$GODOT_BIN" --headless --path . -- --journey=m5_shop_progression --seed=1

      - name: Demo character paint save/restart scenario
        run: xvfb-run -a "$GODOT_BIN" --headless --fixed-fps 120 --path . -- --scenario=character_paint_save_use_restart --seed=1

      - name: Demo Work window lifecycle scenario
        run: xvfb-run -a "$GODOT_BIN" --headless --fixed-fps 120 --path . -- --scenario=work_play_window_behavior --seed=1

      - name: Demo Work resilience scenario
        run: xvfb-run -a "$GODOT_BIN" --headless --fixed-fps 120 --path . -- --scenario=work_mode_resilience --seed=1

      - name: Demo multi-grenade scenario
        run: xvfb-run -a "$GODOT_BIN" --headless --fixed-fps 120 --path . -- --scenario=grenade_multi_capture --seed=1

      - name: Demo economy calibration scenario
        run: xvfb-run -a "$GODOT_BIN" --headless --fixed-fps 120 --path . -- --scenario=economy_calibration --seed=1

      - name: Boot smoke scenario
        run: xvfb-run -a "$GODOT_BIN" --headless --path . -- --scenario=boot_smoke --seed=1

      - name: Boot smoke journey
        run: xvfb-run -a "$GODOT_BIN" --headless --path . -- --journey=boot_smoke --seed=1

      - name: Passive rig scenario
        run: xvfb-run -a "$GODOT_BIN" --headless --path . -- --scenario=passive_rig --seed=1

      - name: Standing and recovery scenario
        run: xvfb-run -a "$GODOT_BIN" --headless --path . -- --scenario=standing_recovery --seed=1

      - name: Seeded autonomous motion scenario
        run: xvfb-run -a "$GODOT_BIN" --headless --path . -- --scenario=autonomous_motion --seed=1

      - name: Laboratory controls scenario
        run: xvfb-run -a "$GODOT_BIN" --headless --path . -- --scenario=laboratory_controls --seed=1

      - name: Grab tether release scenario
        run: xvfb-run -a "$GODOT_BIN" --headless --path . -- --scenario=grab_release --seed=1

      - name: Grab fear resistance scenario
        run: xvfb-run -a "$GODOT_BIN" --headless --path . -- --scenario=grab_resistance --seed=1

      - name: Grab hard-recovery cleanup scenario
        run: xvfb-run -a "$GODOT_BIN" --headless --path . -- --scenario=grab_hard_recovery --seed=1

      - name: Room resize and zoom scenario
        run: xvfb-run -a "$GODOT_BIN" --headless --path . -- --scenario=room_resize_zoom --seed=1

      - name: Lab spawn and settle journey
        run: xvfb-run -a "$GODOT_BIN" --headless --path . -- --journey=lab_spawn_settle --seed=1

      - name: Telemetry export consumer
        run: xvfb-run -a "$GODOT_BIN" --headless --path . -- --scenario=passive_rig --seed=1 --artifacts=.artifacts/passive_rig

      - name: Repeated-run envelope
        run: xvfb-run -a "$GODOT_BIN" --headless --path . -- --scenario=repeat_envelope --seed=1

      - name: Idle soak (three-minute variant)
        run: xvfb-run -a "$GODOT_BIN" --headless --fixed-fps 120 --path . -- --scenario=idle_soak_ci --seed=1 --artifacts=.artifacts/idle_soak_ci

      - name: Dual-profile stability smoke
        run: xvfb-run -a "$GODOT_BIN" --headless --path . -- --scenario=dual_profile_smoke --seed=1 --artifacts=.artifacts/dual_profile_smoke

      - name: Grab-throw journey
        run: xvfb-run -a "$GODOT_BIN" --headless --path . -- --journey=lab_grab_throw --seed=1

      - name: Dropped-tool round-trip scenario
        run: xvfb-run -a "$GODOT_BIN" --headless --fixed-fps 120 --path . -- --scenario=dropped_tool_round_trip --seed=1

      - name: Shared ballistic trajectory scenario
        run: xvfb-run -a "$GODOT_BIN" --headless --fixed-fps 120 --path . -- --scenario=ballistic_trajectory_prediction --seed=1

      - name: Walk-jump journey
        run: xvfb-run -a "$GODOT_BIN" --headless --path . -- --journey=lab_walk_jump --seed=1

      - name: M3 impact deduplication scenario
        run: xvfb-run -a "$GODOT_BIN" --headless --fixed-fps 120 --path . -- --scenario=impact_dedup --seed=1

      - name: M3 Pet and Tickle cadence scenario
        run: xvfb-run -a "$GODOT_BIN" --headless --fixed-fps 120 --path . -- --scenario=pet_tickle_mood --seed=1

      - name: M3 presentation scenario
        run: xvfb-run -a "$GODOT_BIN" --headless --fixed-fps 120 --path . -- --scenario=m3_presentation --seed=1

      - name: A2 shared rig view scenario
        run: xvfb-run -a "$GODOT_BIN" --headless --fixed-fps 120 --path . -- --scenario=character_rig_view --seed=1

      - name: M3 tool feel and reactions scenario
        run: xvfb-run -a "$GODOT_BIN" --headless --fixed-fps 120 --path . -- --scenario=tool_feel_reactions --seed=1

      - name: M3 glove strike journey
        run: xvfb-run -a "$GODOT_BIN" --headless --fixed-fps 120 --path . -- --journey=m3_glove_strike --seed=1

      - name: M3 full tool feel journey
        run: xvfb-run -a "$GODOT_BIN" --headless --fixed-fps 120 --path . -- --journey=m3_tool_feel --seed=1

  full-soak:
    # Thirty simulated minutes; the scenario itself documents this as nightly/manual.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet build DesktopBuddy.sln -c Debug
      - name: Download pinned Godot
        run: |
          set -euo pipefail
          NAME="Godot_v${GODOT_VERSION}_mono_linux_x86_64"
          curl -fL -o godot.zip "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}/${NAME}.zip"
          unzip -q godot.zip
          GODOT_BIN="$(find "$PWD/$NAME" -maxdepth 2 -type f -name 'Godot*' | head -n 1)"
          test -n "$GODOT_BIN"
          chmod +x "$GODOT_BIN"
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"
      - name: Full 30-minute idle soak scenario
        run: xvfb-run -a "$GODOT_BIN" --headless --fixed-fps 120 --path . -- --scenario=idle_soak --seed=1 --artifacts=.artifacts/idle_soak
      - name: Full 30-minute idle soak journey
        run: xvfb-run -a "$GODOT_BIN" --headless --fixed-fps 120 --path . -- --journey=lab_idle_soak --seed=1 --artifacts=.artifacts/lab_idle_soak
