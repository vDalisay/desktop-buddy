name: GodotSteam Hash Probe

on:
  push:
    branches:
      - plan/godotsteam-workshop-social-features

jobs:
  hash:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify exact Asset Library revision and Windows x86_64 payload
        run: |
          set -euo pipefail
          URL="$(jq -r .sourceArchiveUrl tools/godotsteam-dependency.json)"
          EXPECTED_SHA="$(jq -r .archiveSha256 tools/godotsteam-dependency.json)"
          EXPECTED_BYTES="$(jq -r .archiveBytes tools/godotsteam-dependency.json)"
          curl -fL --retry 3 --retry-delay 2 -o godotsteam-4.22.zip "$URL"
          test -s godotsteam-4.22.zip
          ACTUAL_BYTES="$(stat -c%s godotsteam-4.22.zip)"
          ACTUAL_SHA="$(sha256sum godotsteam-4.22.zip | awk '{print toupper($1)}')"
          echo "ARCHIVE_BYTES=$ACTUAL_BYTES"
          echo "ARCHIVE_SHA256=$ACTUAL_SHA"
          test "$ACTUAL_BYTES" = "$EXPECTED_BYTES"
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"
          GDESC="$(unzip -Z1 godotsteam-4.22.zip | grep -E 'addons/godotsteam/godotsteam\.gdextension$' | head -n 1)"
          test -n "$GDESC"
          echo "GDEXTENSION=$GDESC"
          unzip -p godotsteam-4.22.zip "$GDESC" | tee /tmp/godotsteam.gdextension
          grep -Ei 'windows.*x86_64|x86_64.*windows' /tmp/godotsteam.gdextension
          unzip -Z1 godotsteam-4.22.zip | grep -Ei '/addons/godotsteam/.*(win|windows).*64.*\.(dll|so)$' | head -n 20
