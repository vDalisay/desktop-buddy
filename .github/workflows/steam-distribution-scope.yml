name: Steam distribution scope validation

on:
  push:
    paths:
      - DesktopBuddy.csproj
      - src/**
      - data/**
      - devtools/verification/**
      - .github/workflows/steam-pipe.yml
      - .github/workflows/steam-distribution-scope.yml
  pull_request:
    branches: [main]
    paths:
      - DesktopBuddy.csproj
      - src/**
      - data/**
      - devtools/verification/**
      - .github/workflows/steam-pipe.yml
      - .github/workflows/steam-distribution-scope.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: steam-distribution-scope-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.6.1-stable
  GODOT_TEMPLATE_VERSION: 4.6.1.stable.mono
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up .NET (pinned by global.json)
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json

      - name: Distribution-scope verifier regression tests
        run: |
          python3 -m unittest \
            devtools.verification.test_apply_steam_demo_scope \
            devtools.verification.test_verify_steam_distribution_scope

      - name: Build and inspect physically reduced Initial Steam Demo
        shell: bash
        run: |
          set -euo pipefail
          DEMO_ROOT="$RUNNER_TEMP/desktop-buddy-steam-demo"
          rm -rf "$DEMO_ROOT"
          mkdir -p "$DEMO_ROOT"
          rsync -a --delete --exclude '.git' "$GITHUB_WORKSPACE/" "$DEMO_ROOT/"
          cd "$DEMO_ROOT"

          python3 devtools/verification/apply_steam_demo_scope.py . --report "$RUNNER_TEMP/steam-demo-scope.json"
          python3 devtools/verification/apply_steam_demo_scope.py . --check
          dotnet build DesktopBuddy.csproj -c ExportRelease -p:DesktopBuddySteamDemoScope=true

          ASSEMBLY="$(find .godot/mono/temp/bin/ExportRelease -type f -name 'DesktopBuddy.dll' -print -quit)"
          test -n "$ASSEMBLY"
          python3 devtools/verification/verify_steam_distribution_scope.py \
            --target demo --assembly "$ASSEMBLY"
          sha256sum "$RUNNER_TEMP/steam-demo-scope.json" >> "$GITHUB_STEP_SUMMARY"

      - name: Build and inspect Full Release control
        shell: bash
        run: |
          set -euo pipefail
          FULL_ROOT="$RUNNER_TEMP/desktop-buddy-full-control"
          rm -rf "$FULL_ROOT"
          mkdir -p "$FULL_ROOT"
          rsync -a --delete --exclude '.git' "$GITHUB_WORKSPACE/" "$FULL_ROOT/"
          cd "$FULL_ROOT"

          dotnet build DesktopBuddy.csproj -c ExportRelease -p:DesktopBuddySteamDemoScope=false
          ASSEMBLY="$(find .godot/mono/temp/bin/ExportRelease -type f -name 'DesktopBuddy.dll' -print -quit)"
          test -n "$ASSEMBLY"
          python3 devtools/verification/verify_steam_distribution_scope.py \
            --target full --assembly "$ASSEMBLY"

  export_demo_pck:
    name: Export and inspect Initial Steam Demo PCK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up .NET (pinned by global.json)
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json

      - name: Apply physical Initial Steam Demo scope
        shell: bash
        run: |
          set -euo pipefail
          echo "DesktopBuddySteamDemoScope=true" >> "$GITHUB_ENV"
          python3 devtools/verification/apply_steam_demo_scope.py . \
            --report "$RUNNER_TEMP/steam-demo-scope-export.json"
          python3 devtools/verification/apply_steam_demo_scope.py . --check
          dotnet build DesktopBuddy.csproj -c ExportRelease -p:DesktopBuddySteamDemoScope=true

      - name: Materialize verified GodotSteam 4.22 addon
        shell: pwsh
        run: ./tools/install_godotsteam.ps1 -Force

      - name: Download pinned Godot editor and export templates
        shell: bash
        run: |
          set -euo pipefail
          GODOT_NAME="Godot_v${GODOT_VERSION}_mono_linux_x86_64"
          GODOT_URL="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}/${GODOT_NAME}.zip"
          TEMPLATE_NAME="Godot_v${GODOT_VERSION}_mono_export_templates.tpz"
          TEMPLATE_URL="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}/${TEMPLATE_NAME}"

          curl -fL --retry 3 -o "$RUNNER_TEMP/godot.zip" "$GODOT_URL"
          echo "3708d74f19a66b7139f6ba0055ccab0bbc2ed771c3752426fe59046c1b086a17  $RUNNER_TEMP/godot.zip" | sha256sum --check --strict
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"

          GODOT_BIN="$(find "$RUNNER_TEMP/godot/$GODOT_NAME" -maxdepth 2 -type f -name 'Godot*' | head -n 1)"
          test -n "$GODOT_BIN"
          chmod +x "$GODOT_BIN"
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"

          curl -fL --retry 3 -o "$RUNNER_TEMP/$TEMPLATE_NAME" "$TEMPLATE_URL"
          echo "5792661ed089550357e0e10954af695846be0a32ed7494fa40a0009e3b5a3ea9  $RUNNER_TEMP/$TEMPLATE_NAME" | sha256sum --check --strict
          rm -rf "$RUNNER_TEMP/godot-templates"
          mkdir -p "$RUNNER_TEMP/godot-templates"
          unzip -q "$RUNNER_TEMP/$TEMPLATE_NAME" -d "$RUNNER_TEMP/godot-templates"

          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/$GODOT_TEMPLATE_VERSION"
          rm -rf "$TEMPLATE_DIR"
          mkdir -p "$TEMPLATE_DIR"
          cp -a "$RUNNER_TEMP/godot-templates/templates/." "$TEMPLATE_DIR/"
          test -n "$(find "$TEMPLATE_DIR" -maxdepth 1 -type f -name 'windows_release_x86_64.exe' -print -quit)"

      - name: Import physically reduced project
        shell: bash
        run: |
          set -euo pipefail
          xvfb-run -a "$GODOT_BIN" --headless --verbose --path . --import

      - name: Export physically reduced Windows Steam Demo
        shell: bash
        run: |
          set -euo pipefail
          OUTPUT="$RUNNER_TEMP/steam-demo-scope-export"
          rm -rf "$OUTPUT"
          mkdir -p "$OUTPUT"
          xvfb-run -a "$GODOT_BIN" --headless --verbose --path . \
            --export-release "Windows Steam Demo" "$OUTPUT/DesktopBuddy.exe"
          test -s "$OUTPUT/DesktopBuddy.exe"
          test -s "$OUTPUT/DesktopBuddy.pck"

      - name: Verify final PCK physical scope
        shell: bash
        run: |
          set -euo pipefail
          ASSEMBLY="$(find "$GITHUB_WORKSPACE/.godot/mono/temp/bin/ExportRelease" -type f -name 'DesktopBuddy.dll' -print -quit)"
          test -n "$ASSEMBLY"
          python3 devtools/verification/verify_steam_distribution_scope.py \
            --target demo \
            --assembly "$ASSEMBLY" \
            --pck "$RUNNER_TEMP/steam-demo-scope-export/DesktopBuddy.pck"
