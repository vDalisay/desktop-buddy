name: itch.io experimental Web diagnostic

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/itch-web-diagnostic.yml"
  workflow_dispatch:

concurrency:
  group: itch-web-diagnostic-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  GODOT_WEB_PR_SHA: f680cb44eb18c9b354678a487e43e07efb56d9be
  EMSDK_VERSION: 3.1.56

jobs:
  web-export-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install native build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            build-essential scons pkg-config git unzip zip rsync python3 python3-dev \
            libx11-dev libxcursor-dev libxinerama-dev libgl1-mesa-dev libglu1-mesa-dev \
            libasound2-dev libpulse-dev libudev-dev libxi-dev libxrandr-dev \
            libwayland-dev libxkbcommon-dev libfontconfig1-dev libdbus-1-dev
          (cd "$RUNNER_TEMP" && dotnet workload install wasm-tools)

      - name: Fetch pinned Godot C# Web PR
        shell: bash
        run: |
          set -euo pipefail
          SRC="$RUNNER_TEMP/godot-csharp-web"
          rm -rf "$SRC"
          git init "$SRC"
          git -C "$SRC" remote add origin https://github.com/godotengine/godot.git
          git -C "$SRC" fetch --depth=1 origin pull/118976/head
          git -C "$SRC" checkout --detach FETCH_HEAD
          ACTUAL_SHA="$(git -C "$SRC" rev-parse HEAD)"
          if [ "$ACTUAL_SHA" != "$GODOT_WEB_PR_SHA" ]; then
            echo "PR #118976 moved: expected $GODOT_WEB_PR_SHA, fetched $ACTUAL_SHA" >&2
            exit 1
          fi
          echo "GODOT_WEB_SRC=$SRC" >> "$GITHUB_ENV"

      - name: Build experimental Godot editor and .NET SDK
        shell: bash
        run: |
          set -euo pipefail
          cd "$GODOT_WEB_SRC"
          scons -j4 module_mono_enabled=yes
          GODOT_WEB_EDITOR="$(find "$GODOT_WEB_SRC/bin" -maxdepth 1 -type f -executable -name 'godot.*editor*mono*' | head -n 1)"
          if [ -z "$GODOT_WEB_EDITOR" ]; then
            echo "Could not locate the fork's Mono editor binary." >&2
            find "$GODOT_WEB_SRC/bin" -maxdepth 1 -type f -printf '%f\n' || true
            exit 1
          fi
          "$GODOT_WEB_EDITOR" --headless --generate-mono-glue modules/mono/glue
          python3 modules/mono/build_scripts/build_assemblies.py \
            --godot-output-dir ./bin \
            --push-nupkgs-local "$RUNNER_TEMP/godot-web-nuget"
          test -d "$GODOT_WEB_SRC/bin/GodotSharp/Tools/nupkgs"
          echo "GODOT_WEB_EDITOR=$GODOT_WEB_EDITOR" >> "$GITHUB_ENV"

      - name: Install Emscripten SDK
        shell: bash
        run: |
          set -euo pipefail
          EMSDK="$RUNNER_TEMP/emsdk"
          git clone --depth=1 https://github.com/emscripten-core/emsdk.git "$EMSDK"
          "$EMSDK/emsdk" install "$EMSDK_VERSION"
          "$EMSDK/emsdk" activate "$EMSDK_VERSION"
          echo "EMSDK=$EMSDK" >> "$GITHUB_ENV"

      - name: Build and install single-threaded C# Web template
        shell: bash
        run: |
          set -euo pipefail
          source "$EMSDK/emsdk_env.sh"
          cd "$GODOT_WEB_SRC"
          scons -j4 \
            target=template_release \
            platform=web \
            library_type=static_library \
            module_mono_enabled=yes \
            lto=none \
            disable_crash_handler=yes \
            threads=no

          WEB_TEMPLATE="$(find "$GODOT_WEB_SRC/bin" -maxdepth 1 -type f -name 'godot.web.template_release.wasm32.nothreads.mono.zip' | head -n 1)"
          if [ -z "$WEB_TEMPLATE" ]; then
            echo "Expected single-threaded Mono Web template was not produced." >&2
            find "$GODOT_WEB_SRC/bin" -maxdepth 1 -type f -printf '%f\n' || true
            exit 1
          fi

          # The Web exporter validates the standard template directory even when this
          # experimental build is also supplied as a project-local custom template.
          # The pinned fork identifies itself as 4.7.beta.mono and expects these names.
          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/4.7.beta.mono"
          mkdir -p "$TEMPLATE_DIR"
          cp "$WEB_TEMPLATE" "$TEMPLATE_DIR/web_nothreads_release.zip"
          # We only export Release. A debug-named copy satisfies the exporter's preset
          # validation without paying for a second full Web template compilation.
          cp "$WEB_TEMPLATE" "$TEMPLATE_DIR/web_nothreads_debug.zip"
          test -s "$TEMPLATE_DIR/web_nothreads_release.zip"
          test -s "$TEMPLATE_DIR/web_nothreads_debug.zip"

          echo "GODOT_WEB_TEMPLATE=$WEB_TEMPLATE" >> "$GITHUB_ENV"
          echo "GODOT_WEB_TEMPLATE_DIR=$TEMPLATE_DIR" >> "$GITHUB_ENV"

      - name: Prepare disposable Desktop Buddy Web project
        shell: bash
        run: |
          set -euo pipefail
          WEB_WORK="$RUNNER_TEMP/desktop-buddy-web"
          rm -rf "$WEB_WORK"
          mkdir -p "$WEB_WORK"
          rsync -a \
            --exclude='.git/' \
            --exclude='.godot/' \
            --exclude='build/' \
            --exclude='.protected/' \
            ./ "$WEB_WORK/"
          rm -f "$WEB_WORK/global.json"

          NUPKG_DIR="$GODOT_WEB_SRC/bin/GodotSharp/Tools/nupkgs"
          SDK_PACKAGE="$(find "$NUPKG_DIR" -maxdepth 1 -type f -name 'Godot.NET.Sdk.*.nupkg' | sort | tail -n 1)"
          test -n "$SDK_PACKAGE"
          SDK_FILE="$(basename "$SDK_PACKAGE")"
          SDK_VERSION="${SDK_FILE#Godot.NET.Sdk.}"
          SDK_VERSION="${SDK_VERSION%.nupkg}"
          echo "Using experimental Godot.NET.Sdk/$SDK_VERSION"

          python3 - "$WEB_WORK" "$SDK_VERSION" <<'PY'
          import pathlib
          import sys

          root = pathlib.Path(sys.argv[1])
          version = sys.argv[2]
          for relative in (
              "DesktopBuddy.csproj",
              "shared/DesktopBuddy.Visuals/DesktopBuddy.Visuals.csproj",
          ):
              path = root / relative
              text = path.read_text(encoding="utf-8")
              text = text.replace("Godot.NET.Sdk/4.6.1", f"Godot.NET.Sdk/{version}")
              text = text.replace("<TargetFramework>net8.0</TargetFramework>", "<TargetFramework>net10.0</TargetFramework>")
              text = text.replace("<EnableDynamicLoading>true</EnableDynamicLoading>", "<EnableDynamicLoading>false</EnableDynamicLoading>")
              path.write_text(text, encoding="utf-8")

          domain = root / "domain/DesktopBuddy.Domain/DesktopBuddy.Domain.csproj"
          text = domain.read_text(encoding="utf-8")
          text = text.replace("<TargetFramework>net8.0</TargetFramework>", "<TargetFramework>net10.0</TargetFramework>")
          domain.write_text(text, encoding="utf-8")
          PY

          cat > "$WEB_WORK/nuget.config" <<EOF
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <packageSources>
              <clear />
              <add key="godot-web-fork" value="$NUPKG_DIR" />
              <add key="nuget.org" value="https://api.nuget.org/v3/index.json" />
            </packageSources>
          </configuration>
          EOF

          mkdir -p "$WEB_WORK/.web-build"
          cp "$GODOT_WEB_TEMPLATE" "$WEB_WORK/.web-build/godot.web.template_release.wasm32.nothreads.mono.zip"
          echo "WEB_WORK=$WEB_WORK" >> "$GITHUB_ENV"

      - name: Import disposable Web project
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT_WEB_EDITOR" --headless --path "$WEB_WORK" --import

      - name: Export experimental C# Web build with diagnostics
        id: web_export
        shell: bash
        run: |
          set -uo pipefail
          rm -rf "$WEB_WORK/build/itch-web"
          mkdir -p "$WEB_WORK/build/itch-web"
          EXPORT_LOG="$RUNNER_TEMP/desktop-buddy-web-export.log"

          set +e
          "$GODOT_WEB_EDITOR" --headless --verbose --path "$WEB_WORK" \
            --export-release "Web itch.io experimental" "$WEB_WORK/build/itch-web/index.html" \
            2>&1 | tee "$EXPORT_LOG"
          STATUS=${PIPESTATUS[0]}
          set -e

          echo "---- Web export log tail ----"
          tail -n 300 "$EXPORT_LOG" || true
          echo "export_status=$STATUS" >> "$GITHUB_OUTPUT"

          if [ "$STATUS" -ne 0 ]; then
            echo "Desktop Buddy Web export failed with status $STATUS." >&2
            exit "$STATUS"
          fi

          test -f "$WEB_WORK/build/itch-web/index.html"
          test -n "$(find "$WEB_WORK/build/itch-web" -type f -name '*.wasm' -print -quit)"
          test -d "$WEB_WORK/build/itch-web/_framework"

      - name: Upload Web export diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DesktopBuddy-web-export-diagnostics
          path: ${{ runner.temp }}/desktop-buddy-web-export.log
          if-no-files-found: warn

      - name: Browser smoke test
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          WEB_DIR="$WEB_WORK/build/itch-web"
          python3 -m http.server 8123 --bind 127.0.0.1 --directory "$WEB_DIR" > "$RUNNER_TEMP/itch-web-http.log" 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID >/dev/null 2>&1 || true' EXIT

          cd "$RUNNER_TEMP"
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

          cat > smoke.mjs <<'JS'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({headless: true});
          const page = await browser.newPage({ viewport: { width: 1280, height: 940 } });
          const pageErrors = [];
          const consoleErrors = [];
          page.on('pageerror', error => pageErrors.push(String(error)));
          page.on('console', message => {
            if (message.type() === 'error') consoleErrors.push(message.text());
          });
          const response = await page.goto('http://127.0.0.1:8123/index.html', {
            waitUntil: 'domcontentloaded',
            timeout: 120000,
          });
          if (!response || !response.ok()) throw new Error(`HTTP load failed: ${response?.status()}`);
          await page.waitForSelector('canvas', { timeout: 120000 });
          await page.waitForTimeout(20000);
          const canvas = await page.locator('canvas').first().evaluate(el => ({
            width: el.width,
            height: el.height,
            clientWidth: el.clientWidth,
            clientHeight: el.clientHeight,
          }));
          console.log('Canvas:', JSON.stringify(canvas));
          if (canvas.width <= 0 || canvas.height <= 0 || canvas.clientWidth <= 0 || canvas.clientHeight <= 0) {
            throw new Error(`Canvas did not render: ${JSON.stringify(canvas)}`);
          }
          console.log('Page errors:', JSON.stringify(pageErrors));
          console.log('Console errors:', JSON.stringify(consoleErrors));
          if (pageErrors.length) throw new Error(`Browser page errors: ${pageErrors.join(' | ')}`);
          const fatal = consoleErrors.filter(text => /abort|unhandled|wasm.*error|failed to instantiate|godot.*error/i.test(text));
          if (fatal.length) throw new Error(`Fatal browser console errors: ${fatal.join(' | ')}`);
          await browser.close();
          JS
          node smoke.mjs

      - name: Package successful experimental Web build
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          (cd "$WEB_WORK/build/itch-web" && zip -q -r "$GITHUB_WORKSPACE/DesktopBuddy-itch-web-experimental.zip" .)
          test -s "$GITHUB_WORKSPACE/DesktopBuddy-itch-web-experimental.zip"

      - name: Upload successful experimental Web build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: DesktopBuddy-itch-web-experimental
          path: DesktopBuddy-itch-web-experimental.zip
          if-no-files-found: error
