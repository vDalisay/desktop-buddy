name: Hardened NativeAOT + Encrypted PCK Steam Build

on:
  workflow_dispatch:
    inputs:
      target:
        description: Steam product to build
        required: true
        default: demo
        type: choice
        options:
          - demo
          - full
      retain_candidate:
        description: Retain the exact candidate as a public artifact for owner testing
        required: true
        default: false
        type: boolean
      upload:
        description: Upload the hardened candidate to SteamPipe
        required: true
        default: false
        type: boolean
      release_branch:
        description: Optional Steam beta branch to set live after upload; leave blank to upload only
        required: false
        type: string
        default: ""
      build_description:
        description: Optional internal Steam build description
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: encrypted-pck-steam-${{ inputs.target }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.6.1-stable
  GODOT_SOURCE_SHA: 14d19694e0c88a3f9e82d899a0400f27a24c176e
  GODOT_WIN64_SHA256: e10a41f33392f86e93557610611ead8722142913f9e0fab6a8148d1aa5b64c78
  SCONS_VERSION: 4.10.1
  SCONS_WHEEL_SHA256: bd9d1c52f908d874eba92a8c0c0a8dcf2ed9f3b88ab956d0fce1da479c4e7126
  # Valve publishes SteamCMD at a moving URL. Fail closed if those bootstrap bytes change until
  # the new archive has been intentionally reviewed and this non-secret digest is updated.
  # Kept identical to steam-pipe.yml; both upload paths pin the same bootstrap.
  STEAMCMD_BOOTSTRAP_SHA256: "cebf0046bfd08cf45da6bc094ae47aa39ebf4155e5ede41373b579b8f1071e7c"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  compatibility:
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json

      - name: Run H3 helper and verifier tests
        shell: pwsh
        run: |
          python -m unittest `
            devtools.verification.test_prepare_encrypted_pck_spike `
            devtools.verification.test_prepare_nativeaot_spike `
            devtools.verification.test_verify_encrypted_embedded_pck `
            devtools.verification.test_apply_steam_demo_scope `
            devtools.verification.test_verify_steam_distribution_scope `
            devtools.verification.test_run_checked_process
          ./devtools/release/test_verify_authenticode.ps1

      - name: Create ephemeral encryption identity
        shell: pwsh
        run: |
          $bytes = New-Object byte[] 32
          [Security.Cryptography.RandomNumberGenerator]::Fill($bytes)
          $key = [Convert]::ToHexString($bytes).ToLowerInvariant()
          Write-Output "::add-mask::$key"
          $keyId = [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData([Text.Encoding]::UTF8.GetBytes($key))).ToLowerInvariant()
          "GODOT_SCRIPT_ENCRYPTION_KEY=$key" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "SCRIPT_AES256_ENCRYPTION_KEY=$key" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "PCK_KEY_ID=$keyId" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install hash-pinned SCons
        shell: pwsh
        run: |
          $requirement = Join-Path $env:RUNNER_TEMP "scons-requirement.txt"
          "SCons==$env:SCONS_VERSION --hash=sha256:$env:SCONS_WHEEL_SHA256" | Set-Content $requirement
          python -m pip install --require-hashes --only-binary=:all: -r $requirement
          scons --version

      - name: Check out pinned Godot source outside the project
        shell: pwsh
        run: |
          $source = Join-Path $env:RUNNER_TEMP "godot-source"
          git clone --filter=blob:none --no-checkout https://github.com/godotengine/godot.git $source
          git -C $source checkout --detach $env:GODOT_SOURCE_SHA
          git -C $source submodule update --init --recursive --depth 1
          if ((git -C $source rev-parse HEAD) -ne $env:GODOT_SOURCE_SHA) { throw "Godot source identity mismatch." }
          "GODOT_SOURCE=$source" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build keyed Godot 4.6.1 .NET Windows template
        shell: pwsh
        run: |
          $source = $env:GODOT_SOURCE
          $log = Join-Path $env:GITHUB_WORKSPACE "build\release-evidence\encrypted-pck-template-build.log"
          $runner = Join-Path $env:GITHUB_WORKSPACE "devtools\verification\run_checked_process.py"
          New-Item -ItemType Directory -Path (Split-Path $log) -Force | Out-Null
          Push-Location $source
          try {
            python $runner `
              --timeout 5400 --log $log -- `
              scons platform=windows target=template_release arch=x86_64 `
              module_mono_enabled=yes d3d12=no production=yes lto=none debug_symbols=no
            if ($LASTEXITCODE -ne 0) { throw "Keyed template build failed with exit code $LASTEXITCODE; see $log" }
          }
          finally { Pop-Location }

          $template = Get-ChildItem "$source\bin" -File -Filter "godot.windows.template_release.x86_64*.mono.exe" |
            Where-Object Name -NotMatch '\.console\.exe$' | Select-Object -First 1
          if (-not $template) { throw "Keyed Godot .NET Windows release template was not produced." }
          "CUSTOM_TEMPLATE=$($template.FullName)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "CUSTOM_TEMPLATE_SHA256=$((Get-FileHash $template.FullName -Algorithm SHA256).Hash.ToLowerInvariant())" |
            Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Download pinned Godot .NET editor
        shell: pwsh
        run: |
          $name = "Godot_v${env:GODOT_VERSION}_mono_win64"
          $zip = Join-Path $env:RUNNER_TEMP "$name.zip"
          Invoke-WebRequest "https://github.com/godotengine/godot-builds/releases/download/${env:GODOT_VERSION}/$name.zip" -OutFile $zip
          $actual = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $env:GODOT_WIN64_SHA256) { throw "Godot editor checksum mismatch: $actual" }
          $dest = Join-Path $env:RUNNER_TEMP "godot-editor"
          Expand-Archive $zip $dest -Force
          $editor = Get-ChildItem $dest -Recurse -File -Filter "Godot*_mono_win64.exe" | Select-Object -First 1
          if (-not $editor) { throw "Pinned Godot .NET editor was not found." }
          "GODOT_BIN=$($editor.FullName)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Verify NativeAOT scene lifetime regression
        shell: pwsh
        run: |
          python devtools/verification/verify_scene_instantiation_lifetime.py `
            --godot $env:GODOT_BIN --custom-template $env:CUSTOM_TEMPLATE
          if ($LASTEXITCODE -ne 0) { throw "NativeAOT scene lifetime regression failed." }

      - name: Resolve the target product
        shell: pwsh
        env:
          DEMO_APP_ID: ${{ vars.STEAM_DEMO_APP_ID }}
          FULL_APP_ID: ${{ vars.STEAM_FULL_APP_ID }}
        run: |
          if ("${{ inputs.target }}" -eq "demo") {
            $appId = $env:DEMO_APP_ID
            $preset = "Windows Steam Demo"
            $scope = "true"
          } else {
            $appId = $env:FULL_APP_ID
            $preset = "Windows Full Release"
            $scope = "false"
          }
          if ($appId -notmatch '^[1-9][0-9]*$') { throw "The Steam App ID for '${{ inputs.target }}' is missing or invalid." }
          "TARGET_APP_ID=$appId" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "TARGET_PRESET=$preset" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "TARGET_DEMO_SCOPE=$scope" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "Building the ${{ inputs.target }} product: preset '$preset', App $appId."

      - name: Prepare the hardened checkout
        shell: pwsh
        run: |
          # The Demo is physically reduced; the Full Release ships the whole tree and must not be.
          "DesktopBuddySteamDemoScope=$env:TARGET_DEMO_SCOPE" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "DesktopBuddyNativeAot=true" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          if ("${{ inputs.target }}" -eq "demo") {
            python devtools/verification/apply_steam_demo_scope.py . --report build/release-evidence/encrypted-pck-demo-scope.json
            python devtools/verification/apply_steam_demo_scope.py . --check
          }
          $project = Get-Content project.godot -Raw
          $project = [regex]::Replace($project, '(?m)^initialization/app_data/app_id=\d+\s*$', "initialization/app_data/app_id=$env:TARGET_APP_ID", 1)
          Set-Content project.godot $project -NoNewline
          dotnet build DesktopBuddy.csproj -c ExportRelease -p:DesktopBuddySteamDemoScope=$env:TARGET_DEMO_SCOPE
          if ($LASTEXITCODE -ne 0) { throw "Managed control build failed." }
          $control = Get-ChildItem .godot/mono/temp/bin/ExportRelease -Recurse -File -Filter DesktopBuddy.dll | Select-Object -First 1
          if (-not $control) { throw "Could not locate the managed control assembly." }
          python devtools/verification/verify_steam_distribution_scope.py --target ${{ inputs.target }} --assembly $control.FullName
          New-Item build/release-evidence/managed-scope-control -ItemType Directory -Force | Out-Null
          Copy-Item $control.FullName build/release-evidence/managed-scope-control/DesktopBuddy.dll -Force
          dotnet build DesktopBuddy.csproj -c Debug -p:DesktopBuddySteamDemoScope=$env:TARGET_DEMO_SCOPE
          ./tools/install_godotsteam.ps1 -Force
          & $env:GODOT_BIN --headless --verbose --path . --import
          if ($LASTEXITCODE -ne 0) { throw "Godot import failed." }
          python devtools/verification/prepare_nativeaot_spike.py .
          python devtools/verification/prepare_nativeaot_spike.py . --check
          python devtools/verification/prepare_encrypted_pck_spike.py . --custom-template $env:CUSTOM_TEMPLATE --preset "$env:TARGET_PRESET"
          python devtools/verification/prepare_encrypted_pck_spike.py . --custom-template $env:CUSTOM_TEMPLATE --preset "$env:TARGET_PRESET" --check

      - name: Export the hardened NativeAOT encrypted embedded-PCK build
        shell: pwsh
        run: |
          $output = Join-Path $env:GITHUB_WORKSPACE "build\hardened-steam-payload"
          New-Item -ItemType Directory -Path $output -Force | Out-Null
          $exe = Join-Path $output "DesktopBuddy.exe"
          $log = Join-Path $env:GITHUB_WORKSPACE "build\release-evidence\encrypted-pck-export.log"
          python devtools/verification/run_checked_process.py --timeout 3600 --log $log -- `
            $env:GODOT_BIN --headless --verbose --path . --export-release "$env:TARGET_PRESET" $exe
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $exe)) { throw "Encrypted export failed; see $log" }

      - name: Verify exact protected payload
        shell: pwsh
        run: |
          $root = Join-Path $env:GITHUB_WORKSPACE "build\hardened-steam-payload"
          $exe = Join-Path $root "DesktopBuddy.exe"
          python devtools/verification/verify_encrypted_embedded_pck.py $exe
          $assemblies = @(Get-ChildItem $root -Recurse -File -Filter DesktopBuddy.dll)
          if ($assemblies.Count -ne 1) { throw "Expected one native DesktopBuddy.dll, found $($assemblies.Count)." }
          try {
            [void][System.Reflection.AssemblyName]::GetAssemblyName($assemblies[0].FullName)
            throw "DesktopBuddy.dll is still a loadable managed assembly."
          }
          catch [System.BadImageFormatException] { "Confirmed DesktopBuddy.dll is native." }
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $dumpbin = Get-ChildItem (Join-Path $vs "VC\Tools\MSVC") -Recurse -File -Filter dumpbin.exe |
            Where-Object { $_.FullName -match 'Hostx64\\x64\\dumpbin\.exe$' } | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $dumpbin) { throw "Could not locate x64 dumpbin.exe." }
          $headers = & $dumpbin.FullName /headers $assemblies[0].FullName | Out-String
          $exports = & $dumpbin.FullName /exports $assemblies[0].FullName | Out-String
          if ($headers -notmatch '8664 machine \(x64\)' -or $exports -notmatch '\bgodotsharp_game_main_init\b') {
            throw "DesktopBuddy.dll is not an x86_64 NativeAOT Godot library."
          }
          $control = Join-Path $env:GITHUB_WORKSPACE "build\release-evidence\managed-scope-control\DesktopBuddy.dll"
          python devtools/verification/verify_steam_distribution_scope.py --target ${{ inputs.target }} --assembly $control
          Get-ChildItem $root -Recurse -File -Filter *.pdb | Remove-Item -Force
          $forbidden = Get-ChildItem $root -Recurse -File -Include *.pdb,*.map,*.mdb,*.cs,*.fs,*.vb,*.csproj,*.fsproj,*.vbproj,*.sln,*.slnx,*.props,*.targets,*.ps1,*.bat,steam_appid.txt
          if ($forbidden) { throw "Protected export contains forbidden loose files: $($forbidden.FullName -join ', ')" }

      - name: Startup smoke exact encrypted export
        shell: pwsh
        run: |
          $exe = Join-Path $env:GITHUB_WORKSPACE "build\hardened-steam-payload\DesktopBuddy.exe"
          $log = Join-Path $env:GITHUB_WORKSPACE "build\release-evidence\hardened-startup.log"
          python devtools/verification/run_checked_process.py --timeout 60 --log $log -- `
            $exe --headless --quit-after 120
          if ($LASTEXITCODE -ne 0) { throw "Hardened export could not load and run its embedded project; see $log" }
          "Hardened export loaded its embedded project and exited cleanly after 120 frames."

          # The first run boots with no save, which is all this step used to prove. A NativeAOT
          # build that cannot deserialize its own save reads the failure as corruption and aborts
          # boot, so run again against the save the first run just wrote and require that it
          # actually loaded. Booting from nothing is not evidence that an existing player can.
          $reload = Join-Path $env:GITHUB_WORKSPACE "build/release-evidence/hardened-startup-reload.log"
          $save = Join-Path $env:APPDATA "DesktopBuddy/progress.json"
          if (-not (Test-Path $save)) { throw "First run wrote no progress.json; the reload check cannot prove anything." }
          python devtools/verification/run_checked_process.py --timeout 60 --log $reload -- `
            $exe --headless --quit-after 120
          if ($LASTEXITCODE -ne 0) { throw "Hardened export failed to start with an existing save; see $reload" }
          if (Get-ChildItem (Split-Path $save) -Filter "progress.json*corrupt*" -ErrorAction SilentlyContinue) {
            throw "Hardened export quarantined its own save as corrupt; see $reload"
          }
          if (-not (Select-String -Path $reload -Pattern "progress=Loaded" -Quiet)) {
            throw "Hardened export started but did not load the existing save; see $reload"
          }
          "Hardened export loaded an existing save without quarantining it."

      - name: Generate and verify candidate manifest
        shell: pwsh
        run: |
          $root = Join-Path $env:GITHUB_WORKSPACE "build\hardened-steam-payload"
          python devtools/release/release_manifest.py generate `
            --root $root --output (Join-Path $root "release-manifest.json") `
            --distribution "steam-${{ inputs.target }}" --version "hardened-$env:GITHUB_RUN_NUMBER" `
            --git-sha $env:GITHUB_SHA --build-id $env:GITHUB_RUN_ID `
            --godot-version $env:GODOT_VERSION --steam-app-id $env:TARGET_APP_ID
          python devtools/release/release_manifest.py verify `
            --root $root --manifest (Join-Path $root "release-manifest.json")
          "CANDIDATE_MANIFEST_SHA256=$((Get-FileHash (Join-Path $root 'release-manifest.json') -Algorithm SHA256).Hash.ToLowerInvariant())" |
            Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Retain candidate for owner testing
        if: ${{ inputs.retain_candidate || inputs.upload }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hardened-steam-${{ inputs.target }}-${{ github.sha }}
          path: build/hardened-steam-payload
          if-no-files-found: error
          retention-days: 7

      - name: Record non-secret evidence
        if: ${{ always() }}
        shell: pwsh
        run: |
          "### Hardened NativeAOT + encrypted embedded-PCK Steam ${{ inputs.target }}" | Out-File $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          "- Commit: ``$env:GITHUB_SHA``" | Out-File $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          "- Godot source: ``$env:GODOT_SOURCE_SHA``" | Out-File $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          "- Template SHA-256: ``$env:CUSTOM_TEMPLATE_SHA256``" | Out-File $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          "- Ephemeral key ID: ``$env:PCK_KEY_ID``" | Out-File $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          "- Candidate manifest SHA-256: ``$env:CANDIDATE_MANIFEST_SHA256``" | Out-File $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          "- Candidate retained as a public artifact: ``${{ inputs.retain_candidate }}``" | Out-File $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          "- Key, custom template, and logs were not uploaded as artifacts." | Out-File $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

  # SteamPipe runs on Linux even though the payload targets Windows: only the NativeAOT
  # link needs MSVC, so the upload logic, pinned bootstrap and Steam Guard handling are
  # reused unchanged from steam-pipe.yml rather than reimplemented for a Windows client.
  steam_upload:
    name: Upload hardened candidate to SteamPipe
    needs: compatibility
    if: ${{ inputs.upload }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: steam-release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Download the exact hardened candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: hardened-steam-${{ inputs.target }}-${{ github.sha }}
          path: build/steam-content

      - name: Resolve and validate SteamPipe configuration
        id: target
        shell: bash
        env:
          APP_ID: ${{ inputs.target == 'demo' && vars.STEAM_DEMO_APP_ID || vars.STEAM_FULL_APP_ID }}
          DEPOT_ID: ${{ inputs.target == 'demo' && vars.STEAM_DEMO_WINDOWS_DEPOT_ID || vars.STEAM_FULL_WINDOWS_DEPOT_ID }}
          RELEASE_BRANCH: ${{ inputs.release_branch }}
          BUILD_DESCRIPTION: ${{ inputs.build_description }}
          STEAM_USERNAME: ${{ secrets.STEAM_USERNAME }}
          STEAM_CONFIG_VDF: ${{ secrets.STEAM_CONFIG_VDF }}
        run: |
          set -euo pipefail

          [[ "$APP_ID" =~ ^[1-9][0-9]*$ ]] || { echo "The Steam App ID for '${{ inputs.target }}' is missing or invalid." >&2; exit 1; }
          [[ "$DEPOT_ID" =~ ^[1-9][0-9]*$ ]] || { echo "The Windows Depot ID for '${{ inputs.target }}' is missing or invalid." >&2; exit 1; }
          [ -n "$STEAM_USERNAME" ] || { echo "STEAM_USERNAME secret is missing." >&2; exit 1; }
          [ -n "$STEAM_CONFIG_VDF" ] || { echo "STEAM_CONFIG_VDF secret is missing." >&2; exit 1; }

          if [ "$RELEASE_BRANCH" = "default" ]; then
            echo "SteamPipe cannot automatically set the default branch live. Leave release_branch blank and promote the build in Steamworks." >&2
            exit 1
          fi
          if [ -n "$RELEASE_BRANCH" ] && ! [[ "$RELEASE_BRANCH" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "release_branch may contain only letters, numbers, dot, underscore, and dash." >&2
            exit 1
          fi

          description="$BUILD_DESCRIPTION"
          if [ -z "$description" ]; then
            description="Hardened NativeAOT encrypted ${{ inputs.target }} ${GITHUB_SHA::12} (run $GITHUB_RUN_ID)"
          fi

          echo "app_id=$APP_ID" >> "$GITHUB_OUTPUT"
          echo "depot_id=$DEPOT_ID" >> "$GITHUB_OUTPUT"
          echo "build_description=$description" >> "$GITHUB_OUTPUT"

      - name: Verify the downloaded candidate is the exact built payload
        shell: bash
        run: |
          set -euo pipefail
          python3 devtools/release/release_manifest.py verify \
            --root build/steam-content --manifest build/steam-content/release-manifest.json \
            --expect-git-sha "$GITHUB_SHA" --expect-build-id "$GITHUB_RUN_ID" \
            --expect-distribution "steam-${{ inputs.target }}"

          # The hardened export embeds its PCK, so prove the encrypted pack is still inside
          # the shipped executable instead of trusting the build job's copy of that check.
          python3 devtools/verification/verify_encrypted_embedded_pck.py build/steam-content/DesktopBuddy.exe
          if find build/steam-content -type f -iname '*.pck' -print -quit | grep -q .; then
            echo "A loose PCK appeared beside the hardened export; the pack must stay embedded." >&2
            exit 1
          fi

      - name: Install pinned Valve SteamCMD bootstrap
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y lib32gcc-s1

          STEAMCMD_DIR="$RUNNER_TEMP/steamcmd"
          rm -rf "$STEAMCMD_DIR"
          mkdir -p "$STEAMCMD_DIR"

          curl -fL --retry 3 \
            -o "$RUNNER_TEMP/steamcmd_linux.tar.gz" \
            https://steamcdn-a.akamaihd.net/client/installer/steamcmd_linux.tar.gz
          echo "$STEAMCMD_BOOTSTRAP_SHA256  $RUNNER_TEMP/steamcmd_linux.tar.gz" | sha256sum --check --strict
          printf 'SteamCMD bootstrap SHA-256: `%s`\n' "$STEAMCMD_BOOTSTRAP_SHA256" >> "$GITHUB_STEP_SUMMARY"
          tar -xzf "$RUNNER_TEMP/steamcmd_linux.tar.gz" -C "$STEAMCMD_DIR"

          (
            cd "$STEAMCMD_DIR"
            ./steamcmd.sh +quit
          )

          echo "STEAMCMD_DIR=$STEAMCMD_DIR" >> "$GITHUB_ENV"

      - name: Restore Steam Guard session
        shell: bash
        env:
          STEAM_CONFIG_VDF: ${{ secrets.STEAM_CONFIG_VDF }}
        run: |
          set -euo pipefail
          SESSION_FILE="$RUNNER_TEMP/steam-config.vdf"
          printf '%s' "$STEAM_CONFIG_VDF" | base64 -d > "$SESSION_FILE"

          # Current Valve SteamCMD builds on GitHub's Linux runner keep their client state in
          # $HOME/Steam even when steamcmd.sh itself lives elsewhere. Keep the executable-local
          # copy too so a future client that reads either location still finds the session.
          for steam_root in "$HOME/Steam" "$HOME/.local/share/Steam" "$HOME/.steam/steam" "$STEAMCMD_DIR"; do
            mkdir -p "$steam_root/config"
            cp "$SESSION_FILE" "$steam_root/config/config.vdf"
            chmod 600 "$steam_root/config/config.vdf"
          done
          echo "Steam Guard session restored to SteamCMD client-state locations."

      - name: Verify cached Steam login
        shell: bash
        env:
          STEAM_USERNAME: ${{ secrets.STEAM_USERNAME }}
        run: |
          set -euo pipefail
          (
            cd "$STEAMCMD_DIR"
            ./steamcmd.sh +login "$STEAM_USERNAME" +quit
          )

      - name: Generate SteamPipe app build script
        id: steampipe
        shell: bash
        env:
          APP_ID: ${{ steps.target.outputs.app_id }}
          DEPOT_ID: ${{ steps.target.outputs.depot_id }}
          BUILD_DESCRIPTION: ${{ steps.target.outputs.build_description }}
          RELEASE_BRANCH: ${{ inputs.release_branch }}
        run: |
          set -euo pipefail
          CONTENT_ROOT="$GITHUB_WORKSPACE/build/steam-content"
          BUILD_OUTPUT="$RUNNER_TEMP/steampipe-output"
          SCRIPT="$RUNNER_TEMP/app_build_${APP_ID}.vdf"

          mkdir -p "$BUILD_OUTPUT"

          python3 - "$SCRIPT" "$APP_ID" "$DEPOT_ID" "$BUILD_DESCRIPTION" "$CONTENT_ROOT" "$BUILD_OUTPUT" "$RELEASE_BRANCH" <<'PY'
          import pathlib
          import sys

          script, app_id, depot_id, description, content_root, build_output, release_branch = sys.argv[1:]

          def vdf(value: str) -> str:
              return value.replace("\\", "\\\\").replace('"', '\\"')

          lines = [
              '"AppBuild"',
              '{',
              f'    "AppID" "{vdf(app_id)}"',
              f'    "Desc" "{vdf(description)}"',
              f'    "ContentRoot" "{vdf(content_root)}"',
              f'    "BuildOutput" "{vdf(build_output)}"',
          ]
          if release_branch:
              lines.append(f'    "SetLive" "{vdf(release_branch)}"')
          lines += [
              '    "Depots"',
              '    {',
              f'        "{vdf(depot_id)}"',
              '        {',
              '            "FileMapping"',
              '            {',
              '                "LocalPath" "*"',
              '                "DepotPath" "."',
              '                "Recursive" "1"',
              '            }',
              '            "FileExclusion" "*.pdb"',
              '            "FileExclusion" "steam_appid.txt"',
              '        }',
              '    }',
              '}',
              '',
          ]
          pathlib.Path(script).write_text("\n".join(lines), encoding="utf-8")
          PY

          echo "script=$SCRIPT" >> "$GITHUB_OUTPUT"
          echo "SteamPipe script generated for App $APP_ID / Depot $DEPOT_ID."
          if [ -n "$RELEASE_BRANCH" ]; then
            echo "Successful upload will set beta branch '$RELEASE_BRANCH' live."
          else
            echo "Successful upload will not change any live branch."
          fi

      - name: Upload build with SteamPipe
        shell: bash
        env:
          STEAM_USERNAME: ${{ secrets.STEAM_USERNAME }}
          STEAMPIPE_SCRIPT: ${{ steps.steampipe.outputs.script }}
        run: |
          set -euo pipefail
          (
            cd "$STEAMCMD_DIR"
            ./steamcmd.sh \
              +login "$STEAM_USERNAME" \
              +run_app_build "$STEAMPIPE_SCRIPT" \
              +quit
          )

      - name: Remove cached Steam credentials
        if: ${{ always() }}
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/steam-config.vdf"
          for steam_root in "$HOME/Steam" "$HOME/.local/share/Steam" "$HOME/.steam/steam" "$RUNNER_TEMP/steamcmd"; do
            rm -f "$steam_root/config/config.vdf"
          done

      - name: Record upload evidence
        if: ${{ always() }}
        shell: bash
        env:
          APP_ID: ${{ steps.target.outputs.app_id }}
          DEPOT_ID: ${{ steps.target.outputs.depot_id }}
          RELEASE_BRANCH: ${{ inputs.release_branch }}
        run: |
          {
            echo "### Hardened candidate SteamPipe upload"
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- App / Depot: \`$APP_ID\` / \`$DEPOT_ID\`"
            echo "- Beta branch set live: \`${RELEASE_BRANCH:-none}\`"
            echo "- Payload: NativeAOT, encrypted embedded PCK, no loose PCK."
          } >> "$GITHUB_STEP_SUMMARY"
