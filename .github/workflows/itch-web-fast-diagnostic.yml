name: itch.io cached Web AOT diagnostic

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/itch-web-fast-diagnostic.yml"
  workflow_dispatch:

concurrency:
  group: itch-web-fast-diagnostic-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  GODOT_WEB_PR_SHA: f680cb44eb18c9b354678a487e43e07efb56d9be
  EMSDK_VERSION: 3.1.56
  GODOT_WEB_CACHE_VERSION: v2

jobs:
  cached-web-export-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 10 for browser-wasm
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install Web export dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            rsync python3 unzip zip \
            libx11-dev libxcursor-dev libxinerama-dev libgl1-mesa-dev libglu1-mesa-dev \
            libasound2-dev libpulse-dev libudev-dev libxi-dev libxrandr-dev \
            libwayland-dev libxkbcommon-dev libfontconfig1-dev libdbus-1-dev
          (cd "$RUNNER_TEMP" && dotnet workload install wasm-tools)

      - name: Restore cached experimental Web toolchain
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/desktop-buddy/godot-web
          key: godot-web-${{ runner.os }}-${{ env.GODOT_WEB_PR_SHA }}-${{ env.EMSDK_VERSION }}-nothreads-${{ env.GODOT_WEB_CACHE_VERSION }}
          fail-on-cache-miss: true

      - name: Activate cached Godot Web toolchain
        shell: bash
        run: |
          set -euo pipefail
          CACHE_DIR="$HOME/.cache/desktop-buddy/godot-web/$GODOT_WEB_PR_SHA-$EMSDK_VERSION-$GODOT_WEB_CACHE_VERSION"
          GODOT_WEB_EDITOR="$(find "$CACHE_DIR/godot-bin" -maxdepth 1 -type f -name 'godot.*editor*mono*' | head -n 1)"
          test -n "$GODOT_WEB_EDITOR"
          chmod +x "$GODOT_WEB_EDITOR"
          NUPKG_DIR="$CACHE_DIR/nuget"
          GODOT_WEB_TEMPLATE="$CACHE_DIR/templates/web_nothreads_release.zip"
          EMSDK="$CACHE_DIR/emsdk"
          test -n "$(find "$NUPKG_DIR" -type f -name 'Godot.NET.Sdk*.nupkg' -print -quit)"
          test -s "$GODOT_WEB_TEMPLATE"
          test -f "$EMSDK/emsdk_env.sh"

          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/4.7.beta.mono"
          mkdir -p "$TEMPLATE_DIR"
          cp "$GODOT_WEB_TEMPLATE" "$TEMPLATE_DIR/web_nothreads_release.zip"
          cp "$CACHE_DIR/templates/web_nothreads_debug.zip" "$TEMPLATE_DIR/web_nothreads_debug.zip"

          echo "GODOT_WEB_EDITOR=$GODOT_WEB_EDITOR" >> "$GITHUB_ENV"
          echo "NUPKG_DIR=$NUPKG_DIR" >> "$GITHUB_ENV"
          echo "GODOT_WEB_TEMPLATE=$GODOT_WEB_TEMPLATE" >> "$GITHUB_ENV"
          echo "EMSDK=$EMSDK" >> "$GITHUB_ENV"

      - name: Prepare disposable Desktop Buddy Web project
        shell: bash
        run: |
          set -euo pipefail
          WEB_WORK="$RUNNER_TEMP/desktop-buddy-web"
          rm -rf "$WEB_WORK"
          mkdir -p "$WEB_WORK"
          rsync -a \
            --exclude='.git/' \
            --exclude='.godot/' \
            --exclude='build/' \
            --exclude='.protected/' \
            ./ "$WEB_WORK/"
          rm -f "$WEB_WORK/global.json"

          SDK_PACKAGE="$(find "$NUPKG_DIR" -maxdepth 1 -type f -name 'Godot.NET.Sdk.*.nupkg' | sort | tail -n 1)"
          test -n "$SDK_PACKAGE"
          SDK_FILE="$(basename "$SDK_PACKAGE")"
          SDK_VERSION="${SDK_FILE#Godot.NET.Sdk.}"
          SDK_VERSION="${SDK_VERSION%.nupkg}"
          echo "Using experimental Godot.NET.Sdk/$SDK_VERSION"

          python3 - "$WEB_WORK" "$SDK_VERSION" <<'PY'
          import pathlib
          import sys

          root = pathlib.Path(sys.argv[1])
          version = sys.argv[2]
          for relative in (
              "DesktopBuddy.csproj",
              "shared/DesktopBuddy.Visuals/DesktopBuddy.Visuals.csproj",
          ):
              path = root / relative
              text = path.read_text(encoding="utf-8")
              text = text.replace("Godot.NET.Sdk/4.6.1", f"Godot.NET.Sdk/{version}")
              text = text.replace("<TargetFramework>net8.0</TargetFramework>", "<TargetFramework>net10.0</TargetFramework>")
              text = text.replace("<EnableDynamicLoading>true</EnableDynamicLoading>", "<EnableDynamicLoading>false</EnableDynamicLoading>")
              path.write_text(text, encoding="utf-8")

          domain = root / "domain/DesktopBuddy.Domain/DesktopBuddy.Domain.csproj"
          text = domain.read_text(encoding="utf-8")
          text = text.replace("<TargetFramework>net8.0</TargetFramework>", "<TargetFramework>net10.0</TargetFramework>")
          domain.write_text(text, encoding="utf-8")
          PY

          cat > "$WEB_WORK/nuget.config" <<EOF
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <packageSources>
              <clear />
              <add key="godot-web-fork" value="$NUPKG_DIR" />
              <add key="nuget.org" value="https://api.nuget.org/v3/index.json" />
            </packageSources>
          </configuration>
          EOF

          mkdir -p "$WEB_WORK/.web-build"
          cp "$GODOT_WEB_TEMPLATE" "$WEB_WORK/.web-build/godot.web.template_release.wasm32.nothreads.mono.zip"
          echo "WEB_WORK=$WEB_WORK" >> "$GITHUB_ENV"

      - name: Import disposable Web project
        shell: bash
        run: |
          set -euo pipefail
          set -o pipefail
          {
            cd "$WEB_WORK"
            dotnet restore DesktopBuddy.csproj --configfile nuget.config -p:GodotTargetPlatform=web
            "$GODOT_WEB_EDITOR" --headless --verbose --path "$WEB_WORK" --import
          } 2>&1 | tee "$RUNNER_TEMP/desktop-buddy-web-import.log"

      - name: Export experimental C# Web build
        id: web_export
        shell: bash
        run: |
          set -uo pipefail
          source "$EMSDK/emsdk_env.sh"
          rm -rf "$HOME/.local/share/godot/mono/build_logs"
          rm -rf "$WEB_WORK/build/itch-web"
          mkdir -p "$WEB_WORK/build/itch-web"

          set +e
          "$GODOT_WEB_EDITOR" --headless --verbose --path "$WEB_WORK" \
            --export-release "Web itch.io experimental" "$WEB_WORK/build/itch-web/index.html" \
            2>&1 | tee "$RUNNER_TEMP/desktop-buddy-web-export.log"
          STATUS=${PIPESTATUS[0]}
          set -e

          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          echo "$STATUS" > "$RUNNER_TEMP/desktop-buddy-web-export-status.txt"
          exit "$STATUS"

      - name: Collect Godot .NET publish diagnostics
        if: always()
        shell: bash
        run: |
          set -u
          DEST="$RUNNER_TEMP/desktop-buddy-web-msbuild"
          rm -rf "$DEST"
          mkdir -p "$DEST"
          if [ -d "$HOME/.local/share/godot/mono/build_logs" ]; then
            cp -a "$HOME/.local/share/godot/mono/build_logs/." "$DEST/"
          fi
          echo "Collected publish files:"
          find "$DEST" -type f -maxdepth 4 -print || true

      - name: Upload full Web AOT diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DesktopBuddy-web-aot-diagnostics
          path: |
            ${{ runner.temp }}/desktop-buddy-web-import.log
            ${{ runner.temp }}/desktop-buddy-web-export.log
            ${{ runner.temp }}/desktop-buddy-web-export-status.txt
            ${{ runner.temp }}/desktop-buddy-web-msbuild/
          if-no-files-found: warn
          retention-days: 7
          overwrite: true
