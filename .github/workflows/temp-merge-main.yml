name: Temporary merge main into itch Web branch

on:
  push:
    branches:
      - feature/itch-io-limited-build
    paths:
      - .github/workflows/temp-merge-main.yml

permissions:
  contents: write

jobs:
  merge-main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/itch-io-limited-build
          fetch-depth: 0

      - name: Merge current main and resolve known conflict
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main

          set +e
          git merge --no-commit --no-ff origin/main
          merge_status=$?
          set -e

          if [ "$merge_status" -ne 0 ]; then
            mapfile -t conflicts < <(git diff --name-only --diff-filter=U | sort)
            expected="src/UI/Win98/Win98PaintLimbPoseBootstrap.cs"
            if [ "${#conflicts[@]}" -ne 1 ] || [ "${conflicts[0]}" != "$expected" ]; then
              echo "Unexpected merge conflicts:" >&2
              printf '  %s\n' "${conflicts[@]}" >&2
              exit 1
            fi

            # Main contains the newer generalized preview-yaw/limb implementation, which
            # supersedes the older itch-branch version of this same fix.
            git checkout --theirs -- "$expected"
            git add "$expected"
          fi

          unresolved="$(git diff --name-only --diff-filter=U)"
          if [ -n "$unresolved" ]; then
            echo "Unresolved conflicts remain:" >&2
            echo "$unresolved" >&2
            exit 1
          fi

          # The other overlapping files merge cleanly; retain Git's three-way result so both
          # current-main paint polish and the tested browser-specific changes survive.
          git rm -f .github/workflows/temp-merge-main.yml
          git add -A

          if git grep -n -E '^(<<<<<<<|=======|>>>>>>>)' -- '*.cs' '*.yml' '*.yaml'; then
            echo "Conflict markers remain after resolution." >&2
            exit 1
          fi

          git status --short
          git commit -m "Merge main into itch Web branch"
          git push origin HEAD:feature/itch-io-limited-build
